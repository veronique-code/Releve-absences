<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Cahier d'appel</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#25344B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cahier d'appel">
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap');

:root{
  --paper:#F6F3FB;
  --ink:#453B62;
  --ink-soft:#7A719A;
  --margin-red:#E9958A;
  --grid-blue:#D6E7F5;
  --gold:#F3C97E;
  --absent:#C2624B;
  --absent-bg:#FDF0EA;
  --retard:#A97F2E;
  --retard-bg:#FDF4E2;
  --present-green:#3E9080;
  --surface:#FFFFFF;
  --border:#E7E0F2;
}
*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',sans-serif;
  min-height:100vh;
}
.app{
  max-width:920px;
  margin:0 auto;
  padding:0 0 4rem;
}
.masthead{
  background:var(--ink);
  color:var(--paper);
  padding:1.6rem 2rem 1.4rem;
  position:relative;
  overflow:hidden;
}
.masthead::before{
  content:"";
  position:absolute;
  left:38px;top:0;bottom:0;
  width:1px;
  background:var(--margin-red);
  opacity:.55;
}
.masthead h1{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:1.7rem;
  margin:0 0 .15rem 56px;
  letter-spacing:.2px;
}
.masthead p{
  margin:0 0 0 56px;
  font-size:.85rem;
  color:#C9D3C7;
  opacity:.85;
}

.tabs{
  display:flex;
  gap:0;
  padding:0 1.5rem;
  margin-top:-1px;
  background:var(--paper);
  border-bottom:2px solid var(--ink);
}
.tab{
  font-family:'Fraunces',serif;
  font-weight:500;
  font-size:.95rem;
  padding:.85rem 1.3rem .65rem;
  cursor:pointer;
  color:var(--ink-soft);
  background:transparent;
  border:none;
  border-radius:10px 10px 0 0;
  position:relative;
  top:2px;
}
.tab.active{
  color:var(--ink);
  background:var(--surface);
  border:1px solid var(--border);
  border-bottom:2px solid var(--surface);
}

.panel{
  background:var(--surface);
  border:1px solid var(--border);
  border-top:none;
  padding:1.8rem 2rem 2.2rem 2.5rem;
  position:relative;
  background-image:repeating-linear-gradient(
    to bottom,
    transparent,
    transparent 26px,
    var(--grid-blue) 27px
  );
  background-position: 0 4px;
  background-size: 100% 27px;
}
.panel::before{
  content:"";
  position:absolute;
  left:56px; top:0; bottom:0;
  width:1px;
  background:var(--margin-red);
  opacity:.4;
}
.panel > *{ position:relative; }

h2.section-title{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:1.2rem;
  margin:0 0 1rem;
}

.row{
  display:flex;
  gap:.9rem;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:1.1rem;
}
label.field-label{
  font-size:.78rem;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:.05em;
  display:block;
  margin-bottom:.25rem;
}
input[type=date], input[type=text], input[type=month], select{
  font-family:'Inter',sans-serif;
  font-size:.9rem;
  padding:.5rem .65rem;
  border:1px solid var(--border);
  border-radius:6px;
  background:#FCFAF3;
  color:var(--ink);
}
input:focus, select:focus{ outline:2px solid var(--gold); outline-offset:1px; }

.class-pills{
  display:flex;
  gap:.5rem;
  flex-wrap:wrap;
  margin-bottom:1.3rem;
}
.pill{
  padding:.4rem .95rem;
  border:1px solid var(--border);
  border-radius:999px;
  background:#FCFAF3;
  cursor:pointer;
  font-size:.85rem;
  color:var(--ink-soft);
}
.pill.active{
  background:var(--ink);
  color:var(--paper);
  border-color:var(--ink);
}

.status-line{
  font-size:.85rem;
  color:var(--ink-soft);
  margin-bottom:1rem;
}
.status-line b{ color:var(--present-green); }
.status-line b.taken{ color:var(--gold); }

.student-list{
  border:1px solid var(--border);
  border-radius:8px;
  overflow:hidden;
  margin-bottom:1.3rem;
  background:#FEFDF9;
}
.student-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.65rem 1rem;
  border-bottom:1px solid var(--border);
  cursor:pointer;
}
.student-row:last-child{ border-bottom:none; }
.student-row:hover{ background:#F3EEDF; }
.student-row.absent{ background:var(--absent-bg); }
.student-row.retard{ background:var(--retard-bg); }
.student-name{ font-size:.92rem; }
.student-tag{
  font-size:.72rem;
  padding:.2rem .55rem;
  border-radius:999px;
  border:1px solid transparent;
  color:var(--present-green);
  background:#E5F0E9;
}
.student-row.absent .student-tag{
  color:var(--absent);
  background:#F7DACE;
}
.student-row.retard .student-tag{
  color:var(--retard);
  background:#F7E7C2;
}

button{
  font-family:'Inter',sans-serif;
  font-weight:500;
  font-size:.88rem;
  padding:.6rem 1.2rem;
  border-radius:7px;
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--paper);
  cursor:pointer;
}
button.secondary{
  background:transparent;
  color:var(--ink);
}
button.ghost{
  background:transparent;
  color:var(--ink-soft);
  border-color:var(--border);
  padding:.4rem .8rem;
  font-size:.8rem;
}
button.danger-ghost{
  background:transparent;
  color:var(--absent);
  border-color:var(--absent);
  padding:.35rem .7rem;
  font-size:.78rem;
}
button:disabled{ opacity:.45; cursor:not-allowed; }

.empty{
  color:var(--ink-soft);
  font-size:.88rem;
  font-style:italic;
  padding:1rem 0;
}

.class-card{
  border:1px solid var(--border);
  border-radius:8px;
  padding:1rem 1.2rem;
  margin-bottom:1rem;
  background:#FEFDF9;
}
.class-card-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:.7rem;
}
.class-card-head h3{
  font-family:'Fraunces',serif;
  font-size:1.02rem;
  margin:0;
}
.student-chip-list{
  display:flex;
  flex-wrap:wrap;
  gap:.4rem;
  margin-bottom:.7rem;
}
.chip{
  display:flex;
  align-items:center;
  gap:.4rem;
  background:#EFEADA;
  border-radius:999px;
  padding:.3rem .35rem .3rem .75rem;
  font-size:.82rem;
}
.chip button{
  border:none;
  background:transparent;
  color:var(--ink-soft);
  padding:0 .3rem;
  font-size:.9rem;
  line-height:1;
}
.add-line{
  display:flex;
  gap:.5rem;
}
.add-line input{ flex:1; }

.import-student-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
  gap:.35rem .8rem;
  max-height:280px;
  overflow-y:auto;
  padding:.4rem 0;
}
.import-student-row{
  display:flex;
  align-items:center;
  gap:.5rem;
  font-size:.85rem;
}
.import-student-row input[type=text]{
  flex:1;
  padding:.3rem .5rem;
  font-size:.83rem;
}

.day-nav{
  display:flex;
  align-items:center;
  gap:.5rem;
  flex-wrap:wrap;
  margin-bottom:1.1rem;
}
.day-nav .arrow{ padding:.55rem .85rem; }
.day-title{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:1.05rem;
  margin:0 0 1rem;
  color:var(--ink);
}
.day-list{ margin-bottom:1.4rem; }
.day-row{
  display:flex;
  gap:.9rem;
  padding:.6rem 0;
  border-bottom:1px solid var(--border);
  align-items:baseline;
}
.day-row:last-child{ border-bottom:none; }
.day-class{
  flex:0 0 140px;
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:.95rem;
}
.day-names{ flex:1; display:flex; flex-wrap:wrap; gap:.3rem .4rem; }
.day-chip{
  font-size:.85rem;
  padding:.15rem .5rem;
  border-radius:6px;
  background:var(--absent-bg);
  color:var(--absent);
}
.day-chip.ret{ background:var(--retard-bg); color:var(--retard); }
.day-ok{ font-size:.85rem; color:var(--present-green); }
.day-pending{ font-size:.85rem; color:var(--ink-soft); font-style:italic; }
.day-row.pending .day-class{ color:var(--ink-soft); }
@media(max-width:640px){
  .day-row{ flex-direction:column; gap:.3rem; }
  .day-class{ flex:none; }
}

#print-area{ display:none; }

@media print{
  body > *:not(#print-area){ display:none !important; }
  #print-area{ display:block !important; }
  body{ background:#fff; }
}

.pheader{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  font-family:'Fraunces',serif;
  font-size:16px;
  font-weight:600;
  color:#25344B;
  border-bottom:2px solid #25344B;
  padding-bottom:6px;
  margin-bottom:10px;
}
.pgrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}
.pblock{
  border:1px solid #DCD4C0;
  border-radius:6px;
  padding:6px 7px;
  page-break-inside:avoid;
  break-inside:avoid;
}
.pblock-head{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:4px;
}
.pblock-name{
  font-family:'Fraunces',serif;
  font-weight:600;
  font-size:11px;
  color:#25344B;
}
.pblock-rate{
  font-size:8px;
  color:#5B6B85;
}
.pcal-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:1px;
  margin-bottom:4px;
}
.pcal-dow{
  font-size:6.5px;
  text-align:center;
  color:#9A947F;
}
.pcal-cell{
  aspect-ratio:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:7px;
  border-radius:2px;
  color:#5B6B85;
  line-height:1;
}
.pcal-cell.pcal-ok{ background:#E5F0E9; color:#3E6350; }
.pcal-cell.pcal-absent{ background:#F3D6D1; color:#8C332A; font-weight:600; }
.pcal-cell.pcal-absent span{ font-size:6px; }
.pstudents{
  display:flex;
  flex-wrap:wrap;
  gap:2px 6px;
  font-size:8px;
  color:#25344B;
  border-top:1px solid #EFEADA;
  padding-top:3px;
}
.pstudents.pempty{ color:#9A947F; font-style:italic; }

table.pday{ width:100%; border-collapse:collapse; font-size:10px; color:#25344B; }
table.pday th{
  text-align:left; font-size:8px; text-transform:uppercase; letter-spacing:.04em;
  color:#5B6B85; border-bottom:1.5px solid #25344B; padding:3px 4px;
}
table.pday td{ padding:4px; border-bottom:1px solid #E7E0F2; vertical-align:top; }
table.pday td.pday-cls{ font-weight:600; white-space:nowrap; width:110px; }
table.pday td.pday-none{ color:#9A947F; font-style:italic; }
.pday-foot{ margin-top:10px; font-size:9px; color:#5B6B85; }

.stat-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:.8rem;
  margin-bottom:1.6rem;
}
.stat-card{
  background:#FEFDF9;
  border:1px solid var(--border);
  border-radius:8px;
  padding:.9rem 1rem;
}
.stat-card .label{
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.05em;
  color:var(--ink-soft);
  margin-bottom:.3rem;
}
.stat-card .value{
  font-family:'Fraunces',serif;
  font-size:1.5rem;
  font-weight:600;
}
.stat-card .value.rate-high{ color:var(--absent); }
.stat-card .value.rate-ok{ color:var(--present-green); }

table.report{
  width:100%;
  border-collapse:collapse;
  font-size:.87rem;
  margin-bottom:1.5rem;
}
table.report th{
  text-align:left;
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.04em;
  color:var(--ink-soft);
  padding:.5rem .6rem;
  border-bottom:2px solid var(--ink);
}
table.report td{
  padding:.55rem .6rem;
  border-bottom:1px solid var(--border);
}
table.report tr:last-child td{ border-bottom:none; }
table.report td.num{ text-align:right; font-variant-numeric:tabular-nums; }
.bar-track{
  background:#EFEADA;
  border-radius:4px;
  height:8px;
  width:100%;
  overflow:hidden;
}
.bar-fill{
  height:100%;
  background:var(--absent);
  border-radius:4px;
}

.small-note{
  font-size:.78rem;
  color:var(--ink-soft);
  margin-top:-.4rem;
  margin-bottom:1.2rem;
}

.sync-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:.8rem;
  flex-wrap:wrap;
  padding:.7rem 1.5rem;
  background:var(--paper);
  border-bottom:1px solid var(--border);
}
.sync-bar .sync-note{
  font-size:.78rem;
  color:var(--ink-soft);
}
.sync-bar .sync-actions{
  display:flex;
  gap:.5rem;
}

.access-gate{
  position:fixed;
  inset:0;
  background:rgba(37,52,75,.55);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:1.2rem;
  z-index:100;
}
.access-box{
  background:var(--surface);
  border-radius:12px;
  max-width:400px;
  width:100%;
  padding:1.8rem 1.6rem;
  box-shadow:0 10px 40px rgba(0,0,0,.25);
}
.access-box h2{
  font-family:'Fraunces',serif;
  font-size:1.2rem;
  margin:0 0 .6rem;
  color:var(--ink);
}
.access-box p{
  font-size:.85rem;
  color:var(--ink-soft);
  line-height:1.5;
  margin:0 0 1rem;
}
.access-box input{
  width:100%;
  margin-bottom:1rem;
}
.access-box button{
  width:100%;
}
.access-hint{
  font-size:.75rem !important;
  margin:.9rem 0 0 !important;
  font-style:italic;
}

.table-wrap{
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  margin-bottom:1.5rem;
}
.table-wrap table.report{ margin-bottom:0; min-width:340px; }

@media (max-width: 640px){
  .masthead{ padding:1.2rem 1rem 1.1rem; }
  .masthead::before{ left:20px; }
  .masthead h1{ margin-left:34px; font-size:1.35rem; }
  .masthead p{ margin-left:34px; font-size:.78rem; }
  .sync-bar{ padding:.6rem 1rem; }
  .tabs{ padding:0 .6rem; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .tab{ padding:.8rem .65rem .6rem; font-size:.82rem; flex:0 0 auto; white-space:nowrap; text-align:center; }
  .panel{ padding:1.3rem 1rem 1.8rem 1.7rem; background-size:100% 25px; }
  .panel::before{ left:34px; }
  h2.section-title{ font-size:1.05rem; }
  .row{ gap:.6rem; }
  input[type=date], input[type=text], input[type=month], select, button{
    font-size:16px;
    padding:.65rem .8rem;
  }
  button{ min-height:44px; }
  .pill{ padding:.55rem 1rem; font-size:.85rem; }
  .student-row{ padding:.85rem 1rem; min-height:44px; }
  .class-card{ padding:.9rem 1rem; }
  .class-card-head{ flex-wrap:wrap; gap:.5rem; }
  .class-card-head h3{ font-size:.95rem; }
  .import-student-grid{ grid-template-columns:1fr; max-height:340px; }
  .stat-grid{ grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); }
  .add-line{ flex-wrap:wrap; }
  .add-line input{ width:100%; }
}


.retour-hub{
  display:inline-flex;align-items:center;gap:.45rem;
  padding:7px 14px 7px 11px;
  background:#FFFFFF;border:1px solid #E7E0F2;border-radius:999px;
  color:#7A719A;text-decoration:none;
  font-size:13px;font-weight:600;line-height:1;
  transition:color .15s ease,border-color .15s ease;
}
.retour-hub:hover{color:#453B62;border-color:#B7A6E0;}
.retour-hub:focus-visible{outline:2px solid #8A6BB8;outline-offset:2px;}
.retour-hub .fl{display:inline-block;transition:transform .15s ease;}
.retour-hub:hover .fl{transform:translateX(-3px);}
.hub-bar{padding:14px 2rem 0;}
@media (max-width:640px){
  .hub-bar{padding:12px 1.1rem 0;}
  .retour-hub{font-size:15px;padding:9px 16px 9px 13px;}
}
</style>
</head>
<body>

<!-- ================= Accès réservé — portail de connexion ================= -->
<style>
body:not(.ed-ready) > *:not(#ed-gate){display:none !important}
body:not(.ed-ready){overflow:hidden}
#ed-gate{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;
  background:#F6F3FB;padding:1.2rem;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
#ed-gate .ed-box{background:#fff;border:1px solid #E7E0F2;border-radius:16px;padding:1.8rem 1.6rem;
  width:100%;max-width:390px;box-shadow:0 18px 48px rgba(69,59,98,.14)}
#ed-gate h2{margin:0 0 .25rem;font-size:1.2rem;font-weight:600;color:#453B62}
#ed-gate .ed-sub{margin:0 0 1.35rem;font-size:.85rem;line-height:1.45;color:#7A719A}
#ed-gate label{display:block;font-size:.79rem;font-weight:600;color:#453B62;margin:0 0 .3rem}
#ed-gate input{width:100%;box-sizing:border-box;padding:.62rem .7rem;border:1px solid #D9D0EC;
  border-radius:9px;font-size:.95rem;font-family:inherit;color:#453B62;background:#fff;margin:0 0 .9rem}
#ed-gate input:focus{outline:2px solid #B7A6E0;outline-offset:1px;border-color:#B7A6E0}
#ed-gate #ed-go{width:100%;padding:.72rem;border:0;border-radius:9px;background:#8A6BB8;color:#fff;
  font-size:.95rem;font-weight:600;font-family:inherit;cursor:pointer}
#ed-gate #ed-go:disabled{opacity:.55;cursor:default}
#ed-gate .ed-err{margin:.85rem 0 0;font-size:.83rem;line-height:1.4;color:#C2624B;min-height:1.1rem}
#ed-gate .ed-forgot{margin:.9rem 0 0;text-align:center}
#ed-gate .ed-forgot button{background:none;border:0;color:#8A6BB8;text-decoration:underline;
  cursor:pointer;font-family:inherit;font-size:.78rem;padding:0}
#ed-out{position:fixed;left:10px;bottom:10px;z-index:9998;background:#fff;border:1px solid #E7E0F2;
  border-radius:999px;padding:.34rem .72rem;color:#7A719A;cursor:pointer;
  font:500 12px/1 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-shadow:0 2px 8px rgba(69,59,98,.10)}
@media print{#ed-out{display:none !important}}
</style>
<div id="ed-gate">
  <div class="ed-box">
    <h2>Espace direction</h2>
    <p class="ed-sub">École élémentaire Jean Aicard — accès réservé aux comptes autorisés.</p>
    <label for="ed-mail">Adresse électronique</label>
    <input type="email" id="ed-mail" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false">
    <label for="ed-pass">Mot de passe</label>
    <input type="password" id="ed-pass" autocomplete="current-password">
    <button id="ed-go" type="button">Se connecter</button>
    <p class="ed-err" id="ed-err"></p>
    <p class="ed-forgot"><button id="ed-forgot" type="button">Mot de passe oublié</button></p>
  </div>
</div>
<!-- ======================================================================= -->

<div class="app">

  <div class="hub-bar"><a class="retour-hub" href="./index.html"><span class="fl">←</span> Espace direction</a></div>

  <div class="masthead">
    <h1>Cahier d'appel</h1>
    <p>Suivi quotidien des absences &mdash; zone B</p>
  </div>

  <div class="sync-bar">
    <span class="sync-note" id="sync-status">Connexion à la synchronisation…</span>
    <div class="sync-actions">
      <button class="ghost" id="export-btn">⬇ Exporter</button>
      <button class="ghost" id="import-btn">⬆ Importer</button>
      <input type="file" id="import-file-input" accept="application/json" style="display:none">
    </div>
  </div>

  <div class="tabs">

const ED_MSG = {

async function edOuvrirSession(auth){
  try{ await setPersistence(auth, browserLocalPersistence); }catch(e){ /* mode privé */ }
  return new Promise(resolve => {
    const gate = document.getElementById('ed-gate');
    const err  = document.getElementById('ed-err');
    const btn  = document.getElementById('ed-go');
    const mail = document.getElementById('ed-mail');
    const pass = document.getElementById('ed-pass');
    let ouvert = false;

    function ouvrir(u){
      if(ouvert) return;
      ouvert = true;
      gate.remove();
      document.body.classList.add('ed-ready');
      const out = document.createElement('button');
      out.id = 'ed-out';
      out.type = 'button';
      out.textContent = 'Se déconnecter';
      out.title = u.email || '';
      out.addEventListener('click', () => signOut(auth).then(() => location.reload()));
      document.body.appendChild(out);
      resolve(u);
    }

    onAuthStateChanged(auth, u => { if(u) ouvrir(u); });

    async function connecter(){
      err.style.color = '';
      err.textContent = '';
      if(!mail.value.trim() || !pass.value){
        err.textContent = "Renseignez votre adresse et votre mot de passe.";
        return;
      }
      btn.disabled = true;
      try{
        await signInWithEmailAndPassword(auth, mail.value.trim(), pass.value);
      }catch(e){
        err.textContent = ED_MSG[e.code] || "Connexion impossible.";
        btn.disabled = false;
      }
    }

    btn.addEventListener('click', connecter);
    [mail, pass].forEach(el => el.addEventListener('keydown', e => {
      if(e.key === 'Enter') connecter();
    }));

    document.getElementById('ed-forgot').addEventListener('click', async () => {
      const adresse = mail.value.trim();
      if(!adresse){
        err.style.color = '';
        err.textContent = "Indiquez d'abord votre adresse électronique.";
        return;
      }
      try{
        await sendPasswordResetEmail(auth, adresse);
        err.style.color = '#3E9080';
        err.textContent = "Message de réinitialisation envoyé.";
      }catch(e){
        err.style.color = '';
        err.textContent = ED_MSG[e.code] || "Envoi impossible.";
      }
    });
  });
}

async function sha256Hex(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function setSyncStatus(text, ok){
  const el = document.getElementById('sync-status');
  if(el){ el.textContent = text; el.style.color = ok ? 'var(--present-green)' : 'var(--absent)'; }
}

async function initSync(){
  setSyncStatus('Connexion en cours…', true);
  try{
    const hash = DOC_ID;
    docRef = doc(db, 'cahier-appel', hash);
    onSnapshot(docRef, (snap)=>{
      if(snap.exists() && snap.data().payload){
        DATA = JSON.parse(snap.data().payload);
      }
      if(!DATA.classes) DATA = { classes: [], absences: {} };
      trierEleves();
      if(DATA.classes.length && !ui.selectedClass){
        ui.selectedClass = DATA.classes[0].id;
      }
      firstSnapshotReceived = true;
      setSyncStatus('🟢 Synchronisé en temps réel avec vos autres postes.', true);
      render();
    }, (err)=>{
      console.error('Erreur de synchronisation', err);
      setSyncStatus('🔴 Hors ligne — vos modifications seront envoyées au retour de la connexion.', false);
    });
  }catch(e){
    console.error(e);
    setSyncStatus('🔴 Impossible de se connecter à la synchronisation.', false);
  }
}

// Classe les élèves par ordre alphabétique. localeCompare avec 'fr' gère
// correctement les accents (Élodie se range entre Elias et Emma) et
// 'numeric' évite que Élève 10 passe avant Élève 2.
function trierEleves(){
  if(!DATA.classes) return;
  DATA.classes.forEach(c=>{
    if(Array.isArray(c.students)){
      c.students.sort((a,b)=> (a.name||'').localeCompare(b.name||'', 'fr', { sensitivity:'base', numeric:true }));
    }
  });
}

async function saveData(){
  if(!docRef) return;
  trierEleves();
  try{
    await setDoc(docRef, { payload: JSON.stringify(DATA), updatedAt: Date.now() });
  }catch(e){
    console.error('Erreur d\'enregistrement', e);
    setSyncStatus('🔴 Hors ligne — vos modifications seront envoyées au retour de la connexion.', false);
  }
}

function exportCahierData(){

}

function importCahierData(file){
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const incoming = JSON.parse(e.target.result);
      if(!incoming || !Array.isArray(incoming.classes) || typeof incoming.absences !== 'object'){
        throw new Error('format invalide');
      }
      const hasExisting = DATA.classes.length > 0 || Object.keys(DATA.absences).length > 0;
      const merge = hasExisting
        ? confirm(`Vous avez déjà des données sur cet appareil.\n\nOK = fusionner avec le fichier importé\nAnnuler = remplacer entièrement par le fichier importé`)
        : true;
      if(merge && hasExisting){
        const existingIds = new Set(DATA.classes.map(c=>c.id));
        incoming.classes.forEach(c=>{ if(!existingIds.has(c.id)) DATA.classes.push(c); });
        Object.keys(incoming.absences).forEach(date=>{
          if(!DATA.absences[date]) DATA.absences[date] = {};
          Object.assign(DATA.absences[date], incoming.absences[date]);
        });
      }else{
        DATA = incoming;
      }
      ui.selectedClass = DATA.classes[0] ? DATA.classes[0].id : null;
      await saveData();
      render();
      alert('Import terminé : ' + DATA.classes.length + ' classe(s) au total.');
    }catch(err){
      alert("Ce fichier ne peut pas être importé (format JSON invalide).");
    }
  };
  reader.readAsText(file);
}

function renderAppel(){
  const panel = document.getElementById('panel-appel');
  if(DATA.classes.length===0){
    panel.innerHTML = `

      <p class="empty">Aucune classe enregistrée. Rendez-vous dans l'onglet <b>Classes</b> pour créer votre première classe et y ajouter des élèves.</p>
    `;
    return;
  }
  if(!ui.selectedClass || !DATA.classes.find(c=>c.id===ui.selectedClass)){
    ui.selectedClass = DATA.classes[0].id;
  }
  const cls = DATA.classes.find(c=>c.id===ui.selectedClass);
  const dayRecord = (DATA.absences[ui.selectedDate] && DATA.absences[ui.selectedDate][cls.id]) || null;
  const absentSet = new Set(dayRecord ? dayRecord.absentIds : []);
  // lateIds n'existe pas dans les appels enregistrés avant l'ajout des
  // retards : on retombe alors sur une liste vide.
  const lateSet = new Set(dayRecord && dayRecord.lateIds ? dayRecord.lateIds : []);
  const taken = dayRecord !== null;
  const etatDe = sid => absentSet.has(sid) ? 'absent' : lateSet.has(sid) ? 'retard' : '';
  const libelleDe = e => e==='absent' ? 'Absent' : e==='retard' ? 'En retard' : 'Présent';

  panel.innerHTML = `
    <h2 class="section-title">Faire l'appel</h2>
    <div class="row">
      <div>
        <label class="field-label">Date</label>
        <input type="date" id="date-input" value="${ui.selectedDate}">
      </div>
    </div>
    <label class="field-label">Classe</label>
    <div class="class-pills" id="pill-row">
      ${DATA.classes.map((c,i)=>`<button class="pill ${c.id===ui.selectedClass?'active':''}" data-cid="${c.id}">${i+1}. ${escapeHtml(c.name)}</button>`).join('')}
    </div>
    <div class="status-line">
      ${cls.students.length===0
        ? '<span class="empty">Cette classe n\'a pas encore d\'élèves.</span>'
        : taken
          ? `Appel <b class="taken">déjà enregistré</b> pour cette date &mdash; ${absentSet.size} absent${absentSet.size>1?'s':''} sur ${cls.students.length}${lateSet.size ? ` · ${lateSet.size} retard${lateSet.size>1?'s':''}` : ''}.`
          : `Appel <b>non encore enregistré</b> pour cette date.`
      }
    </div>
    ${cls.students.length>0 ? `
    <div class="student-list" id="student-list">
      ${cls.students.map(s=>`
        <div class="student-row ${etatDe(s.id)}" data-sid="${s.id}">
          <span class="student-name">${escapeHtml(s.name)}</span>
          <span class="student-tag">${libelleDe(etatDe(s.id))}</span>
        </div>
      `).join('')}
    </div>
    <p class="small-note" style="margin:.5rem 0 0;">Touchez un nom pour faire défiler&nbsp;: présent → absent → en retard.</p>
    <button id="validate-btn">${taken ? 'Mettre à jour l\'appel' : 'Valider l\'appel du jour'}</button>
    ` : ''}
  `;

  document.getElementById('date-input').addEventListener('change', e=>{
    ui.selectedDate = e.target.value;
    render();
  });
  panel.querySelectorAll('#pill-row .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      ui.selectedClass = p.dataset.cid;
      render();
    });
  });
  const list = document.getElementById('student-list');
  if(list){
    let workingAbsent = new Set(absentSet);
    let workingLate = new Set(lateSet);
    list.querySelectorAll('.student-row').forEach(row=>{
      row.addEventListener('click', ()=>{
        const sid = row.dataset.sid;
        // Cycle : présent → absent → en retard → présent
        let etat;
        if(workingAbsent.has(sid)){
          workingAbsent.delete(sid); workingLate.add(sid); etat = 'retard';
        }else if(workingLate.has(sid)){
          workingLate.delete(sid); etat = '';
        }else{
          workingAbsent.add(sid); etat = 'absent';
        }
        row.classList.remove('absent','retard');
        if(etat) row.classList.add(etat);
        row.querySelector('.student-tag').textContent = libelleDe(etat);

    });
    document.getElementById('validate-btn').addEventListener('click', async ()=>{
      if(!DATA.absences[ui.selectedDate]) DATA.absences[ui.selectedDate] = {};
      DATA.absences[ui.selectedDate][cls.id] = {
        absentIds: Array.from(workingAbsent),
        lateIds: Array.from(workingLate)
      };
      await saveData();
      render();
    });
  }
}

/* ---------- Absents du jour ---------- */

const DAY_NAMES = ['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];

function formatDateLong(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return `${DAY_NAMES[dt.getDay()]} ${d} ${MONTH_NAMES[m-1]} ${y}`;
}

function shiftDate(iso, delta){
  const [y,m,d] = iso.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+delta);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}

function buildDayReport(date){
  const jour = DATA.absences[date] || {};
  const rows = DATA.classes.map(c=>{
    const rec = jour[c.id] || null;
    const nameOf = sid => {
      const s = c.students.find(x=>x.id===sid);
      return s ? s.name : '(élève retiré de la liste)';
    };
    const tri = (a,b)=> a.localeCompare(b,'fr');
    return {
      cls: c,
      taken: rec !== null,
      absents: rec ? rec.absentIds.map(nameOf).sort(tri) : [],
      retards: rec && rec.lateIds ? rec.lateIds.map(nameOf).sort(tri) : []
    };
  });
  return {
    rows,
    totalAbs: rows.reduce((n,r)=>n+r.absents.length, 0),
    totalRet: rows.reduce((n,r)=>n+r.retards.length, 0),
    done: rows.filter(r=>r.taken).length,
    effectif: DATA.classes.reduce((n,c)=>n+c.students.length, 0)
  };
}

function dayListAsText(date){
  const rep = buildDayReport(date);
  const lignes = [`Absents du ${formatDateLong(date)}`, ''];
  rep.rows.forEach(r=>{
    if(!r.taken){ lignes.push(`${r.cls.name} : appel non saisi`); return; }
    if(r.absents.length===0 && r.retards.length===0){ lignes.push(`${r.cls.name} : tous présents`); return; }
    let l = `${r.cls.name} : ${r.absents.length ? r.absents.join(', ') : 'aucun absent'}`;
    if(r.retards.length) l += ` (retards : ${r.retards.join(', ')})`;
    lignes.push(l);
  });
  lignes.push('');
  lignes.push(`Total : ${rep.totalAbs} absent${rep.totalAbs>1?'s':''} sur ${rep.effectif} élèves${rep.totalRet ? ` · ${rep.totalRet} retard${rep.totalRet>1?'s':''}` : ''}.`);
  return lignes.join('\n');
}

async function copyDayList(date){
  const texte = dayListAsText(date);
  const note = document.getElementById('day-copy-note');
  try{
    await navigator.clipboard.writeText(texte);
    note.textContent = 'Liste copiée : vous pouvez la coller dans un message ou un courriel.';
  }catch(err){
    const ta = document.createElement('textarea');
    ta.value = texte;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
    document.body.removeChild(ta);
    note.textContent = ok
      ? 'Liste copiée : vous pouvez la coller dans un message ou un courriel.'
      : "Copie impossible sur cet appareil. Utilisez plutôt le bouton « Imprimer la liste ».";
  }
  note.style.display = 'block';
  setTimeout(()=>{ note.style.display = 'none'; }, 5000);
}

function printDayList(date){
  if(DATA.classes.length===0){ alert("Aucune classe à imprimer."); return; }
  const rep = buildDayReport(date);
  const lignes = rep.rows.map(r=>{
    let cellule;
    if(!r.taken){
      cellule = '<td class="pday-none" colspan="2">Appel non saisi</td>';

      const abs = r.absents.length ? escapeHtml(r.absents.join(', ')) : '<span style="color:#9A947F;">Aucun</span>';
      const ret = r.retards.length ? escapeHtml(r.retards.join(', ')) : '—';
      cellule = `<td>${abs}</td><td style="width:22%">${ret}</td>`;
    }
    return `<tr><td class="pday-cls">${escapeHtml(r.cls.name)}</td>${cellule}</tr>`;
  }).join('');

  document.getElementById('print-area').innerHTML = `
    <div class="pheader">
      <span>Absents du jour &mdash; École Jean Aicard</span>
      <span>${formatDateLong(date)}</span>
    </div>
    <table class="pday">
      <thead><tr><th>Classe</th><th>Absents</th><th>Retards</th></tr></thead>
      <tbody>${lignes}</tbody>
    </table>
    <p class="pday-foot">${rep.totalAbs} absent${rep.totalAbs>1?'s':''} sur ${rep.effectif} élèves inscrits${rep.totalRet ? ` &middot; ${rep.totalRet} retard${rep.totalRet>1?'s':''}` : ''} &middot; ${rep.done}/${DATA.classes.length} appel${DATA.classes.length>1?'s':''} saisi${rep.done>1?'s':''}.</p>
  `;
  setTimeout(()=> window.print(), 60);
}

async function moveClass(id, dir){
  const idx = DATA.classes.findIndex(c=>c.id===id);
  const newIdx = idx+dir;
  if(idx===-1 || newIdx<0 || newIdx>=DATA.classes.length) return;
  const tmp = DATA.classes[idx];
  DATA.classes[idx] = DATA.classes[newIdx];
  DATA.classes[newIdx] = tmp;
  await saveData();
  render();
}

function normalizeClassCode(name){
  return name.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Z0-9]/g,'');
}

async function sortByRoutine(){
  const routine = ['CE1CE2','CE1A','CM1A','CE1B','CE2A','CM1B','CPA','CPC','CPB','CM1CM2','CE2B','CM2A','CM2B'];
  const withIndex = DATA.classes.map((c,i)=>({ c, i }));
  withIndex.sort((x,y)=>{
    const ix = routine.indexOf(normalizeClassCode(x.c.name));
    const iy = routine.indexOf(normalizeClassCode(y.c.name));
    const px = ix===-1 ? routine.length+x.i : ix;
    const py = iy===-1 ? routine.length+y.i : iy;
    return px-py;
  });
  DATA.classes = withIndex.map(w=>w.c);
  await saveData();
  render();
  const unmatched = DATA.classes.filter(c=>!routine.includes(normalizeClassCode(c.name)));
  if(unmatched.length){
    alert("Certaines classes n'ont pas pu être reconnues automatiquement et ont été placées à la fin : " + unmatched.map(c=>c.name).join(', ') + ". Utilisez les flèches ▲▼ pour les repositionner.");
  }
}

async function handlePdfInput(e){
  const file = e.target.files[0];
  if(!file) return;
  const statusEl = document.getElementById('import-status');
  statusEl.style.display = 'block';
  statusEl.textContent = 'Lecture du PDF en cours...';
  try{
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const candidates = [];
    for(let p=1; p<=pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const textContent = await page.getTextContent();
      const lines = groupTextIntoLines(textContent);
      candidates.push(parseLinesToClass(lines, p));
    }
    importCandidates = candidates;
    statusEl.textContent = `${pdf.numPages} page(s) analysée(s). Vérifiez et corrigez les listes ci-dessous avant de les importer.`;
    renderImportReview();
  }catch(err){
    statusEl.textContent = "Impossible de lire ce PDF. Vérifiez qu'il contient bien du texte sélectionnable (pas un scan image).";
  }
  e.target.value = '';
}

function groupTextIntoLines(textContent){
  const rows = {};
  textContent.items.forEach(item=>{
    const y = Math.round(item.transform[5]/3)*3;
    if(!rows[y]) rows[y] = [];
    rows[y].push({ x:item.transform[4], str:item.str });
  });
  const ys = Object.keys(rows).map(Number).sort((a,b)=>b-a);
  return ys.map(y=>{
    return rows[y].sort((a,b)=>a.x-b.x).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim();
  }).filter(Boolean);
}

function parseLinesToClass(lines, pageIndex){
  const classNameRegex = /^(.+?)\s+Nombre d['’]él[èe]ves\s*:/i;
  const studentLineRegex = /^(.+?)\s+\d{2}\/\d{2}\/\d{4}\s+[MFmf]\s+\S+\s*$/;
  let className = '';
  const students = [];
  lines.forEach(line=>{
    const clean = line.replace(/^\d+[\.\)]\s*/, '').trim();
    if(!clean) return;
    if(!className){
      const cm = clean.match(classNameRegex);
      if(cm){ className = cm[1].trim(); return; }
    }
    const sm = clean.match(studentLineRegex);
    if(sm) students.push(sm[1].trim());
  });
  if(students.length===0){
    const noiseRegex = /^(nom|pr[ée]nom|effectif|liste|date|page \d+|[ée]cole|ann[ée]e scolaire|total|classe de|t[ée]l|courriel|enseignant|naissance|\d{5}\s|rue|avenue|chemin|boulevard)/i;
    lines.forEach(line=>{
      const clean = line.replace(/^\d+[\.\)]\s*/, '').trim();
      if(!clean || clean.length<2) return;
      if(noiseRegex.test(clean)) return;
      if(/^\d+$/.test(clean)) return;
      if(/\d{2}\/\d{2}\/\d{4}/.test(clean)) return;
      students.push(clean);
    });
  }
  if(!className) className = `Classe (page ${pageIndex})`;
  return { className, students };
}

async function confirmImport(){
  const area = document.getElementById('import-review-area');
  area.querySelectorAll('.class-card').forEach(card=>{
    const include = card.querySelector('.import-include').checked;
    if(!include) return;
    const name = card.querySelector('.import-class-name').value.trim();
    const studentNames = [];
    card.querySelectorAll('.import-student-row').forEach(row=>{
      const checked = row.querySelector('.import-student-check').checked;
      const val = row.querySelector('.import-student-name').value.trim();
      if(checked && val) studentNames.push(val);
    });
    if(!name || studentNames.length===0) return;
    DATA.classes.push({
      id: uid(),
      name,
      students: studentNames.map(n=>({ id: uid(), name: n }))
    });
  });
  importCandidates = [];
  document.getElementById('import-status').style.display='none';
  await saveData();
  render();
}

function computeClassStats(month, classesList){
  return classesList.map(c=>{
    let daysTaken = 0, totalAbsences = 0, totalRetards = 0;
    const perStudent = {};
    const perStudentRetard = {};
    const perDay = {};
    c.students.forEach(s=>{ perStudent[s.id] = 0; perStudentRetard[s.id] = 0; });
    Object.keys(DATA.absences).forEach(date=>{
      if(!date.startsWith(month)) return;
      const rec = DATA.absences[date][c.id];
      if(!rec) return;
      daysTaken++;
      totalAbsences += rec.absentIds.length;
      perDay[date] = rec.absentIds.length;
      rec.absentIds.forEach(sid=>{
        if(perStudent[sid]===undefined) perStudent[sid]=0;
        perStudent[sid]++;
      });
      (rec.lateIds || []).forEach(sid=>{
        if(perStudentRetard[sid]===undefined) perStudentRetard[sid]=0;
        perStudentRetard[sid]++;
        totalRetards++;
      });
    });
    const nbStudents = c.students.length || 1;
    const rate = daysTaken>0 ? (totalAbsences/(nbStudents*daysTaken))*100 : 0;
    return { cls:c, daysTaken, totalAbsences, totalRetards, rate, perStudent, perStudentRetard, perDay };
  });
}

function renderStats(){
  const panel = document.getElementById('panel-stats');
  if(DATA.classes.length===0){
    panel.innerHTML = `
      <h2 class="section-title">Statistiques</h2>
      <p class="empty">Ajoutez des classes et faites l'appel pour voir apparaître des statistiques ici.</p>
    `;
    return;
  }
  panel.innerHTML = `
    <h2 class="section-title">Statistiques</h2>
    <div class="row" style="justify-content:space-between; align-items:flex-end;">
      <div class="row" style="margin-bottom:0;">
        <div>
          <label class="field-label">Mois</label>
          <input type="month" id="month-input" value="${ui.statMonth}">
        </div>
        <div>
          <label class="field-label">Classe</label>
          <select id="class-select">
            <option value="ALL">Toutes les classes</option>
            ${DATA.classes.map(c=>`<option value="${c.id}" ${ui.statClass===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}
          </select>
        </div>
      </div>
      <button class="secondary" id="export-pdf-btn">Exporter le mois en PDF</button>
    </div>
    <div id="stats-body"></div>
  `;
  document.getElementById('month-input').value = ui.statMonth;
  document.getElementById('class-select').value = ui.statClass;

  document.getElementById('month-input').addEventListener('change', e=>{
    ui.statMonth = e.target.value;
    renderStats();
  });
  document.getElementById('class-select').addEventListener('change', e=>{
    ui.statClass = e.target.value;
    renderStats();
  });
  document.getElementById('export-pdf-btn').addEventListener('click', ()=>{
    exportMonthToPdf(ui.statMonth);
  });

  const body = document.getElementById('stats-body');
  const month = ui.statMonth;
  const classesToShow = ui.statClass==='ALL' ? DATA.classes : DATA.classes.filter(c=>c.id===ui.statClass);
  const classStats = computeClassStats(month, classesToShow);

  if(classStats.every(cs=>cs.daysTaken===0)){
    body.innerHTML = '<p class="empty">Aucun appel enregistré pour ce mois.</p>';
    return;
  }

  const summaryCards = classStats.map(cs=>`
    <div class="stat-card">
      <div class="label">${escapeHtml(cs.cls.name)}</div>
      <div class="value ${cs.rate>=10?'rate-high':'rate-ok'}">${cs.daysTaken>0 ? cs.rate.toFixed(1)+'%' : '—'}</div>
      <div class="small-note" style="margin:.2rem 0 0;">${cs.totalAbsences} absence${cs.totalAbsences>1?'s':''}${cs.totalRetards ? ` · ${cs.totalRetards} retard${cs.totalRetards>1?'s':''}` : ''} · ${cs.daysTaken} jour${cs.daysTaken>1?'s':''} d'appel</div>
    </div>
  `).join('');

  let rateTable = '';
  if(ui.statClass==='ALL' && classesToShow.length>1){
    rateTable = `
      <div class="table-wrap">
      <table class="report">
        <thead><tr><th>Classe</th><th style="width:40%">Taux d'absence</th><th class="num">%</th></tr></thead>
        <tbody>
          ${classStats.map(cs=>`
            <tr>
              <td>${escapeHtml(cs.cls.name)}</td>
              <td><div class="bar-track"><div class="bar-fill" style="width:${Math.min(cs.rate,100).toFixed(1)}%"></div></div></td>
              <td class="num">${cs.daysTaken>0 ? cs.rate.toFixed(1)+'%' : '—'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
    `;
  }

  const studentRows = [];
  classStats.forEach(cs=>{
    cs.cls.students.forEach(s=>{
      const count = cs.perStudent[s.id] || 0;
      const retards = cs.perStudentRetard[s.id] || 0;
      if(count>0 || retards>0){
        studentRows.push({ className: cs.cls.name, name: s.name, count, retards });
      }
    });
  });
  studentRows.sort((a,b)=> (b.count - a.count) || (b.retards - a.retards));

  const studentTable = studentRows.length===0
    ? '<p class="empty">Aucune absence ni retard enregistré ce mois-ci.</p>'
    : `
      <div class="table-wrap">
      <table class="report">
        <thead><tr>
          <th>Élève</th>
          ${ui.statClass==='ALL' ? '<th>Classe</th>' : ''}
          <th class="num">Absences</th>
          <th class="num">Retards</th>
        </tr></thead>
        <tbody>
          ${studentRows.map(r=>`
            <tr>
              <td>${escapeHtml(r.name)}</td>
              ${ui.statClass==='ALL' ? `<td>${escapeHtml(r.className)}</td>` : ''}
              <td class="num">${r.count}</td>
              <td class="num">${r.retards || '—'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      </div>
    `;

  body.innerHTML = `
    <div class="stat-grid">${summaryCards}</div>
    ${rateTable}
    <h2 class="section-title" style="font-size:1.05rem;">Absences et retards par élève</h2>
    ${studentTable}
  `;
}

const MONTH_NAMES = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];

function buildMiniCalendar(month, perDay){
  const [y,m] = month.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const firstDow = (new Date(y, m-1, 1).getDay() + 6) % 7;
  let cells = '';
  for(let i=0;i<firstDow;i++) cells += '<div></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const count = perDay[dateStr];
    if(count===undefined){
      cells += `<div class="pcal-cell pcal-empty">${d}</div>`;
    }else if(count===0){
      cells += `<div class="pcal-cell pcal-ok">${d}</div>`;
    }else{
      cells += `<div class="pcal-cell pcal-absent">${d}<span>${count}</span></div>`;
    }
  }
  return `<div class="pcal-grid">
    <div class="pcal-dow">L</div><div class="pcal-dow">M</div><div class="pcal-dow">M</div><div class="pcal-dow">J</div><div class="pcal-dow">V</div><div class="pcal-dow">S</div><div class="pcal-dow">D</div>
    ${cells}
  </div>`;
}

function exportMonthToPdf(month){
  if(DATA.classes.length===0){ alert("Aucune classe à exporter."); return; }
  const classStats = computeClassStats(month, DATA.classes);
  const [y,m] = month.split('-').map(Number);
  const monthLabel = `${MONTH_NAMES[m-1]} ${y}`;

  const blocks = classStats.map(cs=>{
    const studentLines = Object.entries(cs.perStudent)
      .map(([sid,count])=>({ name: (cs.cls.students.find(s=>s.id===sid)||{}).name || '', count }))
      .filter(r=>r.count>0)
      .sort((a,b)=>b.count-a.count);
    return `
      <div class="pblock">
        <div class="pblock-head">
          <span class="pblock-name">${escapeHtml(cs.cls.name)}</span>
          <span class="pblock-rate">${cs.daysTaken>0 ? cs.rate.toFixed(1)+'%' : 'aucun appel'} ${cs.daysTaken>0 ? `· ${cs.totalAbsences} absence${cs.totalAbsences>1?'s':''}${cs.totalRetards ? ` · ${cs.totalRetards} retard${cs.totalRetards>1?'s':''}` : ''} · ${cs.daysTaken} j.` : ''}</span>
        </div>
        ${buildMiniCalendar(month, cs.perDay)}
        ${studentLines.length ? `<div class="pstudents">${studentLines.map(r=>`<span>${escapeHtml(r.name)} <b>${r.count}</b></span>`).join('')}</div>` : '<div class="pstudents pempty">Aucune absence</div>'}
      </div>
    `;
  }).join('');

  document.getElementById('print-area').innerHTML = `
    <div class="pheader">
      <span>Cahier d'appel</span>
      <span>${monthLabel}</span>
    </div>
    <div class="pgrid">${blocks}</div>
  `;
  setTimeout(()=> window.print(), 60);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
